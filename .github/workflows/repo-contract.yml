name: Repo Contract

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to verify.
        required: true
        default: main
        type: string
      base_ref:
        description: Exclusive base ref for diff hygiene.
        required: true
        default: HEAD^
        type: string

permissions:
  contents: read

jobs:
  web-and-repo-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate tickets and repo contract
        run: |
          python3 Scripts/validate_humble_tickets.py
          python3 Scripts/validate_repo_contract.py

      - name: Compile Python and check web fallback
        run: |
          python3 -m py_compile Scripts/*.py
          python3 Scripts/check_web_fallback.py

      - name: Test localhost export and catalog endpoints
        run: python3 Scripts/test_serve_local_preview.py

      - name: Test supported-app catalog search and fallback
        run: |
          node --check js/app.js
          node Scripts/test_supported_app_catalog.cjs

      - name: Check whitespace in the PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/$BASE_REF...HEAD"

  supported-app-browser-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated Playwright and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/humble-studio-playwright"
          npm --prefix "$RUNNER_TEMP/humble-studio-playwright" install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/humble-studio-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run real Chromium browser smoke
        env:
          NODE_PATH: ${{ runner.temp }}/humble-studio-playwright/node_modules
          HUMBLESTUDIO_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/humble-studio-browser-evidence
        run: node Scripts/smoke_supported_app_browser.cjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humble-studio-browser-smoke
          path: ${{ runner.temp }}/humble-studio-browser-evidence/
          if-no-files-found: ignore

  contract-and-native-sanity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repo-native tickets
        run: python3 Scripts/validate_humble_tickets.py

      - name: Validate repo contract
        run: python3 Scripts/validate_repo_contract.py

      - name: Compile local workflow scripts
        run: python3 -m py_compile Scripts/*.py

      - name: Web fallback integrity
        run: python3 Scripts/check_web_fallback.py

      - name: Diff whitespace check
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: git diff --check "$BASE_REF..HEAD"

      - name: Native sanity build
        run: xcodebuild -project HumbleStudio.xcodeproj -scheme HumbleStudioMac -configuration Debug CODE_SIGNING_ALLOWED=NO build
