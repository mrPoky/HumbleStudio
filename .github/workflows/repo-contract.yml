name: Repo Contract

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to verify.
        required: true
        default: main
        type: string
      base_ref:
        description: Exclusive base ref for diff hygiene.
        required: true
        default: HEAD^
        type: string

permissions:
  contents: read

jobs:
  contract-and-native-sanity:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repo-native tickets
        run: python3 Scripts/validate_humble_tickets.py

      - name: Validate repo contract
        run: python3 Scripts/validate_repo_contract.py

      - name: Compile local workflow scripts
        run: python3 -m py_compile Scripts/*.py

      - name: Web fallback integrity
        run: python3 Scripts/check_web_fallback.py

      - name: Diff whitespace check
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: git diff --check "$BASE_REF..HEAD"

      - name: Native sanity build
        run: xcodebuild -project HumbleStudio.xcodeproj -scheme HumbleStudioMac -configuration Debug CODE_SIGNING_ALLOWED=NO build
